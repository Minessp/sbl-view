name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Código morto (knip)
        run: npm run knip
      - name: Testes (motor, dados, contraste)
        run: npm test
      - name: Build
        run: npm run build
      - name: Orçamento da shell (JS e CSS iniciais, gzip)
        run: node scripts/budget.mjs

  smoke:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Fumaça e acessibilidade (axe, WCAG 2.2 AA)
        run: |
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on@8 http://localhost:4173
          node scripts/smoke.mjs http://localhost:4173
          node scripts/a11y.mjs http://localhost:4173
