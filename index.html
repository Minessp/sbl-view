<!doctype html>
<html lang="%SBL_LANG%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="%SBL_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SBL View" />
    <meta property="og:title" content="%SBL_OG_TITLE%" />
    <meta property="og:description" content="%SBL_OG_DESCRIPTION%" />
    <meta property="og:locale" content="%SBL_OG_LOCALE%" />
    <meta name="twitter:card" content="summary" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0A0F15" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="%BASE_URL%%SBL_MANIFEST%" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <title>SBL View</title>
    <script>
      // Escuro é o padrão; o claro salvo entra antes da primeira pintura (evita piscar).
      try {
        if (localStorage.getItem('sbl-theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#EBEDEF');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>%SBL_NOSCRIPT%</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
